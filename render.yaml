# Optional: add SUPABASE_DB_URL (or DATABASE_URL) in the Render dashboard —
# PostgreSQL URI from Supabase → Settings → Database (pooler :6543 recommended).
services:
  - type: web
    name: abbieysearch
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
    healthCheckPath: /health
