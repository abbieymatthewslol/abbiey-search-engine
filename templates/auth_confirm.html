{% extends "auth_base.html" %}
{% block title %}Signing you in · abbieysearch{% endblock %}

{% block auth_content %}
<div class="auth-heading">
    <h1 class="auth-title">Signing you in…</h1>
    <p class="auth-subtitle" id="status-msg">Please wait while we finish setting up your session.</p>
</div>
<div class="auth-errors" id="sb-error" role="alert" aria-live="polite" style="display:none"></div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='vendor/supabase.min.js') }}"></script>
<script type="application/json" id="auth-supabase-config">{{ {'url': supabase_url, 'anon_key': supabase_anon_key} | tojson }}</script>
<script nonce="{{ csp_nonce }}">
(function () {
    var _cfgEl = document.getElementById('auth-supabase-config');
    var _cfg = {};
    if (_cfgEl && _cfgEl.textContent) {
        try {
            _cfg = JSON.parse(_cfgEl.textContent.trim()) || {};
        } catch (_e) {
            _cfg = {};
        }
    }
    var SB_URL = _cfg.url || '';
    var SB_KEY = _cfg.anon_key || '';

    var sb;
    try {
        sb = window.supabase.createClient(SB_URL, SB_KEY, {
            auth: {
                flowType: 'implicit',
                detectSessionInUrl: true,
                persistSession: true,
                autoRefreshToken: true
            }
        });
    } catch (e) {
        var _er = document.getElementById('sb-error');
        if (_er) {
            _er.style.display = 'block';
            _er.innerHTML = '<p>Auth init failed. <a href="/login">Try again</a>.</p>';
        }
        return;
    }

    var errEl = document.getElementById('sb-error');
    var statusEl = document.getElementById('status-msg');
    /** True after redirect started, unrecoverable error shown, or success. */
    var finished = false;
    var syncInFlight = false;

    function emailFromUser(u) {
        if (!u) return '';
        if (u.email) return String(u.email).trim();
        var meta = u.user_metadata || {};
        if (meta.email) return String(meta.email).trim();
        var ids = u.identities || [];
        for (var i = 0; i < ids.length; i++) {
            var id = ids[i];
            if (id && id.identity_data && id.identity_data.email) {
                return String(id.identity_data.email).trim();
            }
        }
        return '';
    }

    function escapeHtml(s) {
        return String(s || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/"/g, '&quot;');
    }

    function showErr(msg) {
        finished = true;
        errEl.style.display = 'block';
        errEl.innerHTML = '<p>' + msg + '</p>';
    }

    /**
     * Sync Supabase user into Flask session. Avoid nested sb.auth.getSession() here — it can
     * deadlock with GoTrue navigator locks while the PKCE code exchange is still settling.
     */
    async function syncAndRedirect(session) {
        if (!session || syncInFlight || finished) return;
        syncInFlight = true;
        statusEl.textContent = 'Almost there…';

        try {
            var user = session.user;
            if (!user) {
                var gu = await sb.auth.getUser();
                user = gu && gu.data && gu.data.user;
            }
            if (!user) {
                showErr('Invalid session. <a href="/login">Try again</a>.');
                return;
            }
            var emailAddr = emailFromUser(user);
            if (!emailAddr || emailAddr.indexOf('@') < 0) {
                showErr('No email on this account. <a href="/login">Try again</a> with a provider that shares email.');
                return;
            }

            var ctrl = new AbortController();
            var abortTimer = setTimeout(function () { ctrl.abort(); }, 20000);
            var cb = await fetch('/auth/callback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({
                    email: emailAddr,
                    display_name: (user.user_metadata || {}).full_name || ''
                }),
                signal: ctrl.signal
            });
            clearTimeout(abortTimer);

            var data = await cb.json().catch(function () { return null; });

            if (cb.ok && data && data.ok) {
                finished = true;
                window.location.replace('/search');
                return;
            }
            showErr('Session sync failed. <a href="/login">Try again</a>.');
        } catch (e) {
            if (e && e.name === 'AbortError') {
                showErr('Server took too long to respond. <a href="/login">Try again</a>.');
            } else {
                showErr('Something went wrong. <a href="/login">Try again</a>.');
            }
        } finally {
            syncInFlight = false;
        }
    }

    (async function () {
        try {
            var params = new URLSearchParams(window.location.search);
            var oauthErr = params.get('error');
            if (oauthErr) {
                var oauthDesc = (params.get('error_description') || oauthErr).replace(/\+/g, ' ');
                try {
                    oauthDesc = decodeURIComponent(oauthDesc);
                } catch (e3) { /* keep raw */ }
                showErr('Sign-in did not finish. ' + escapeHtml(oauthDesc) + ' <a href="/login">Try again</a>.');
                return;
            }

            var code = params.get('code');
            if (code) {
                /* Implicit flow doesn't use a code param — if we somehow got one, fall through */
            }

            sb.auth.onAuthStateChange(function (_event, session) {
                if (session && !finished) {
                    void syncAndRedirect(session);
                }
            });

            /* With implicit flow the session arrives via onAuthStateChange (hash processing).
               getSession() may return null here before the hash is consumed — that is normal.
               Only surface a hard error if getSession() itself returns an error. */
            var gs = await sb.auth.getSession();
            if (gs.error) {
                showErr(escapeHtml(gs.error.message || 'Auth error') + ' <a href="/login">Try again</a>.');
                return;
            }
            if (gs.data && gs.data.session && !finished) {
                await syncAndRedirect(gs.data.session);
            }
            /* If no session yet, onAuthStateChange will fire once the hash is processed.
               The 25-second timeout below handles the genuine timeout/failure case. */
        } catch (e) {
            showErr('Auth init failed. <a href="/login">Try again</a>.');
        }
    })();

    setTimeout(function () {
        if (!finished) {
            showErr('Could not complete sign-in. <a href="/login">Try again</a>.');
        }
    }, 25000);

})();
</script>
{% endblock %}
