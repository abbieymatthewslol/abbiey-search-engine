<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include 'includes/theme_bootstrap.html' %}
    <title>API docs — abbieysearch</title>
    <meta name="description" content="Interactive API documentation for abbiey.search /api/v1 endpoints.">
    <link rel="canonical" href="{{ site_base_url }}/api/v1/docs">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=deploy_hash) }}">
    <style nonce="{{ csp_nonce }}">
        body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); }
        #topbar {
            position: sticky; top: 0; z-index: 10;
            padding: .75rem 1.25rem;
            background: color-mix(in srgb, var(--bg-elevated) 92%, transparent);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex; gap: 1rem; align-items: center; justify-content: space-between;
        }
        #topbar a {
            color: var(--accent);
            text-decoration: none;
            font-size: .92rem;
            transition: opacity var(--dur-fast) var(--ease-out);
        }
        #topbar a:hover { text-decoration: underline; opacity: 0.9; }
        #topbar .brand { font-weight: 700; color: var(--text); font-size: 1rem; }
    </style>
</head>
<body>
    <nav id="topbar">
        <span class="brand">abbieysearch API</span>
        <span>
            <a href="/docs/api">Full docs</a>
            &nbsp;·&nbsp;
            <a href="/developer">Manage API keys</a>
            &nbsp;·&nbsp;
            <a href="/openapi.json">openapi.json</a>
            &nbsp;·&nbsp;
            <a href="/status">Status</a>
        </span>
    </nav>
    <redoc spec-url="/openapi.json"></redoc>
    <script src="https://cdn.jsdelivr.net/npm/redoc@2.1.5/bundles/redoc.standalone.js" nonce="{{ csp_nonce }}" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>
</html>
