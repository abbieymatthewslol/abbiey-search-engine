{% extends "auth_base.html" %}
{% block title %}Sign in · abbiey.search{% endblock %}

{% block auth_content %}

        <div class="auth-heading" id="auth-form-title">
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Sign in to your account.</p>
        </div>

        {% if error %}
        <div class="auth-errors" role="alert" aria-live="polite">
            <p>{{ error }}</p>
        </div>
        {% endif %}

        <form class="auth-form" method="POST" action="/login" id="login-form" autocomplete="on" aria-labelledby="auth-form-title">
            <input type="hidden" name="next" value="{{ next or '' }}">

            <div class="auth-field">
                <label for="identifier">Email or username</label>
                <div class="auth-input-pill">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="auth-input-icon" aria-hidden="true"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input type="text" name="identifier" id="identifier"
                           value="{{ identifier or '' }}"
                           placeholder="you@example.com or yourname"
                           autocomplete="username" required autofocus>
                </div>
            </div>

            <div class="auth-field">
                <label for="password">Password</label>
                <div class="auth-input-pill">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="auth-input-icon" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                    <input type="password" name="password" id="password"
                           placeholder="Your password" autocomplete="current-password" required>
                    <button type="button" class="pw-toggle" aria-label="Show password" aria-controls="password">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="search-btn auth-submit" id="login-submit">Sign in</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="/signup">Create one free</a></p>
{% endblock %}

{% block extra_scripts %}
<script>
    (function () {
        const form = document.getElementById("login-form");
        const submit = document.getElementById("login-submit");
        if (form && submit) {
            form.addEventListener("submit", function () {
                if (submit.disabled) return;
                submit.disabled = true;
                submit.setAttribute("aria-busy", "true");
            });
        }
    })();
    document.querySelectorAll('.pw-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
            const inp = btn.previousElementSibling;
            const showing = inp.type === 'password';
            inp.type = showing ? 'text' : 'password';
            btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
        });
    });
</script>
{% endblock %}
