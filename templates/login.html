{% extends "base.html" %}
{% block title %}Sign in · abbiey.search{% endblock %}

{% block content %}
<main class="auth-main">
    <div class="auth-container">

        <div class="auth-heading">
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Sign in to your account.</p>
        </div>

        {% if error %}
        <div class="auth-errors">
            <p>{{ error }}</p>
        </div>
        {% endif %}

        <form class="auth-form" method="POST" action="/login" autocomplete="on">
            <input type="hidden" name="next" value="{{ next or '' }}">

            <div class="auth-field">
                <div class="auth-input-pill">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="auth-input-icon"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input type="text" name="identifier" id="identifier"
                           value="{{ identifier or '' }}"
                           placeholder="Email or username"
                           autocomplete="username" required autofocus>
                </div>
            </div>

            <div class="auth-field">
                <div class="auth-input-pill">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="auth-input-icon"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                    <input type="password" name="password" id="password"
                           placeholder="Password" autocomplete="current-password" required>
                    <button type="button" class="pw-toggle" aria-label="Show password">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="search-btn auth-submit">Sign in</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="/signup">Create one free</a></p>
    </div>
</main>
{% endblock %}

{% block extra_scripts %}
<script>
    document.querySelectorAll('.pw-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
            const inp = btn.previousElementSibling;
            inp.type = inp.type === 'password' ? 'text' : 'password';
        });
    });
</script>
{% endblock %}
