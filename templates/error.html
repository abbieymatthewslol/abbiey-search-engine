<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} - abbiey.search</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='44' cy='44' r='28' fill='none' stroke='%2300e5a0' stroke-width='10'/><line x1='64' y1='64' x2='90' y2='90' stroke='%2300e5a0' stroke-width='10' stroke-linecap='round'/></svg>"></head>
<body>
    <header>
        <a href="/" class="logo">abbiey.<span>search</span></a>
        <button id="theme-toggle" aria-label="Toggle theme">
            <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
    </header>

    <main class="error-page">
        <div class="error-container">
            <span class="error-code">{{ code }}</span>
            <h1 class="error-title">{{ title }}</h1>
            <p class="error-message">{{ message }}</p>
            <a href="/" class="error-home-btn">Back to Search</a>
        </div>
    </main>

    <footer>
        <p>abbiey.search &mdash; No tracking. No profiling. No judgment.</p>
    </footer>

    <script>
        const toggle = document.getElementById("theme-toggle");
        const html = document.documentElement;
        const saved = localStorage.getItem("theme");
        if (saved) html.setAttribute("data-theme", saved);
        toggle.addEventListener("click", () => {
            const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
            html.setAttribute("data-theme", next);
            localStorage.setItem("theme", next);
        });
    </script>
</body>
</html>
