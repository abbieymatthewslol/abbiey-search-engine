{# Apply saved theme + UI prefs before CSS loads (parity with static/script.js applySettings). #}
<script nonce="{{ csp_nonce }}">
(function() {
    var t  = localStorage.getItem('theme') || 'dark';
    var d  = localStorage.getItem('density') || 'default';
    var a  = localStorage.getItem('accent-color') || localStorage.getItem('accentColor');
    var fs = localStorage.getItem('abbiey_font_size');
    var ff = localStorage.getItem('abbiey_font_family');
    var r  = localStorage.getItem('abbiey_radius');
    var w  = localStorage.getItem('abbiey_width');
    var m  = localStorage.getItem('abbiey_motion');
    var us = localStorage.getItem('abbiey_url_style');
    var ss = localStorage.getItem('abbiey_snippet_style');
    var sb = localStorage.getItem('abbiey_searchbar');
    var el = document.documentElement;
    el.setAttribute('data-theme', t);
    el.setAttribute('data-density', d);
    if (a)  el.style.setProperty('--accent', a);
    if (fs) el.setAttribute('data-font-size', fs);
    if (ff) el.setAttribute('data-font', ff);
    if (r && r !== 'default')  el.setAttribute('data-radius', r);
    if (w && w !== 'default') el.setAttribute('data-width', w);
    if (m && m !== 'full') el.setAttribute('data-motion', m);
    if (us) el.setAttribute('data-url-style', us);
    if (ss) el.setAttribute('data-snippet-style', ss);
    if (sb) el.setAttribute('data-searchbar', sb);
})();
</script>
<style nonce="{{ csp_nonce }}">
/* Keep the primary search control slim and readable across saved themes. */
.search-box {
    padding: 0.32rem 0.4rem 0.32rem 0.9rem !important;
    gap: 0.28rem !important;
    background: #ffffff !important;
}
body:not(.has-results) .search-box {
    padding: 0.3rem 0.36rem 0.3rem 0.86rem !important;
}
#search-input {
    color: #111827 !important;
    -webkit-text-fill-color: #111827 !important;
    caret-color: #111827 !important;
    line-height: 1.25 !important;
    padding: 0 !important;
}
#search-input::placeholder {
    color: rgba(17, 24, 39, 0.56) !important;
    -webkit-text-fill-color: rgba(17, 24, 39, 0.56) !important;
}
.search-icon,
.reverse-image-btn,
.voice-btn {
    color: rgba(17, 24, 39, 0.58) !important;
}
.reverse-image-btn,
.voice-btn,
.search-btn.search-btn-icon {
    width: 34px !important;
    height: 34px !important;
    min-height: 34px !important;
}
body.has-results .reverse-image-btn,
body.has-results .voice-btn,
body.has-results .search-btn.search-btn-icon,
body:not(.has-results) .reverse-image-btn,
body:not(.has-results) .voice-btn,
body:not(.has-results) .search-btn.search-btn-icon {
    width: 32px !important;
    height: 32px !important;
    min-height: 32px !important;
}
@media (max-width: 480px) {
    .search-box,
    body:not(.has-results) .search-box {
        padding: 0.24rem 0.28rem 0.24rem 0.72rem !important;
    }
    .reverse-image-btn,
    .voice-btn,
    .search-btn.search-btn-icon {
        width: 32px !important;
        height: 32px !important;
        min-height: 32px !important;
    }
}
</style>
