<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account · abbiey.search</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
</head>
<body>
    <header>
        <a href="/" class="logo">abbiey.<span>search</span></a>
        <div class="header-controls">
            <button id="theme-toggle" aria-label="Toggle theme">
                <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
            </button>
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-card-header">
                <div class="auth-logo-mark">🔍</div>
                <h1 class="auth-title">Create your account</h1>
                <p class="auth-subtitle">Free, private, yours forever.</p>
            </div>

            {% if errors %}
            <ul class="auth-errors">
                {% for e in errors %}<li>{{ e }}</li>{% endfor %}
            </ul>
            {% endif %}

            <form class="auth-form" method="POST" action="/signup" autocomplete="on">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" value="{{ username or '' }}"
                           placeholder="yourname" autocomplete="username"
                           minlength="3" maxlength="30" required>
                    <span class="form-hint">Letters, numbers, underscores — 3 to 30 chars</span>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="{{ email or '' }}"
                           placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" name="password"
                               placeholder="Min 8 characters" autocomplete="new-password"
                               minlength="8" required>
                        <button type="button" class="pw-toggle" aria-label="Show password">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm password</label>
                    <div class="password-wrap">
                        <input type="password" id="confirm_password" name="confirm_password"
                               placeholder="Same password again" autocomplete="new-password"
                               minlength="8" required>
                        <button type="button" class="pw-toggle" aria-label="Show password">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="auth-submit-btn">Create account</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
        </div>
    </main>

    <script>
        // Theme toggle
        const root = document.documentElement;
        const saved = localStorage.getItem('theme') || 'dark';
        root.setAttribute('data-theme', saved);
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });
        // Password visibility toggles
        document.querySelectorAll('.pw-toggle').forEach(btn => {
            btn.addEventListener('click', () => {
                const inp = btn.previousElementSibling;
                inp.type = inp.type === 'password' ? 'text' : 'password';
            });
        });
    </script>
</body>
</html>
