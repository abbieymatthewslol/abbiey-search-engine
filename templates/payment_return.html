<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Returning… · abbiey.search</title>
    <meta name="robots" content="noindex,nofollow">
    <script nonce="{{ csp_nonce }}">
    (function () {
        var LS_KEY = "abbiey_checkout_return";
        var SITE_BASE = {{ site_base_url | tojson }};
        var SEARCH_FALLBACK = {{ (url_for("search") + "?paid=1") | tojson }};
        var DEV_FALLBACK = {{ (url_for("developer") + "?billing=success#dev-api-keys") | tojson }};

        function safePath(p) {
            if (typeof p !== "string" || !p.startsWith("/") || p.startsWith("//")) return null;
            return p;
        }

        function go(path) {
            window.location.replace(path);
        }

        try {
            var raw = localStorage.getItem(LS_KEY);
            if (raw) localStorage.removeItem(LS_KEY);
            var data = raw ? JSON.parse(raw) : null;
            if (data && data.kind === "search") {
                var sp = safePath(data.path);
                if (sp) {
                    try {
                        var u = new URL(sp, SITE_BASE);
                        u.searchParams.set("paid", "1");
                        go(u.pathname + u.search + u.hash);
                        return;
                    } catch (e) {}
                }
                go(SEARCH_FALLBACK);
                return;
            }
            if (data && data.kind === "developer") {
                go(DEV_FALLBACK);
                return;
            }
        } catch (e) {}
        go(SEARCH_FALLBACK);
    })();
    </script>
    <!-- Vercel Speed Insights -->
    <script nonce="{{ csp_nonce }}">
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body style="margin:0;background:#0a0a0a;color:#a3a3a3;font-family:system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;font-size:.9rem;">
    <p>Redirecting&hellip; <a href="{{ url_for('search') }}?paid=1" style="color:#e7e5e4;">Continue to search</a></p>
</body>
</html>
