<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled — abbiey.search</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
    <style>
        .cancel-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .cancel-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0,0,0,.4);
            animation: heroIn .5s cubic-bezier(.16,1,.3,1) both;
        }
        .cancel-icon { font-size: 2.5rem; margin-bottom: 1rem; display: block; }
        .cancel-title { font-size: 1.4rem; font-weight: 700; color: var(--text); margin-bottom: .5rem; }
        .cancel-sub { color: var(--text-dim); font-size: .9rem; line-height: 1.6; margin-bottom: 1.75rem; }
        .btn-row { display: flex; gap: .75rem; flex-direction: column; }
        .btn-primary {
            display: inline-block;
            background: var(--accent);
            color: #0a0a0a;
            font-weight: 700;
            font-size: .95rem;
            padding: .65rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(110,231,183,.3); }
        .btn-secondary {
            display: inline-block;
            color: var(--text-dim);
            font-size: .9rem;
            padding: .65rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            border: 1px solid var(--border);
            transition: border-color .15s ease, color .15s ease;
        }
        .btn-secondary:hover { border-color: var(--accent); color: var(--text); }
    </style>
</head>
<body>
    <div class="cancel-page">
        <div class="cancel-card">
            <span class="cancel-icon">↩️</span>
            <h1 class="cancel-title">No charge made</h1>
            <p class="cancel-sub">
                You cancelled checkout — nothing was charged.<br>
                Whenever you're ready, full access is just a click away.
            </p>
            <div class="btn-row">
                <a href="/landing#pricing" class="btn-primary">Try Again</a>
                <a href="/" class="btn-secondary">Back to Search</a>
            </div>
        </div>
    </div>
    <script>
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
    </script>
</body>
</html>
