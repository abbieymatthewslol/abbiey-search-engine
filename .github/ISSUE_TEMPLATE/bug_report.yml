name: Bug Report
description: Report a reproducible defect in abbiey.search
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Search for '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Browser + version:
        - OS:
        - Search query that triggered the bug:
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who is affected and how severely?
    validations:
      required: false

  - type: textarea
    id: rollback
    attributes:
      label: Suggested rollback / workaround
      description: If you know how to temporarily work around this, describe it here.
    validations:
      required: false
