# Automated checks and smoke tests that run on every push. The expensive
# browser-based Playwright smoke tests are gated behind the optional
# SITE_URL / ADMIN_TOKEN repo secrets so forks don't silently fail.
#
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   SITE_URL          Production origin, e.g. https://abbieysearch.com
#   ADMIN_TOKEN       Same token as Vercel ADMIN_TOKEN - used to call /admin/api/health
#   API_TEST_KEY      A non-revoked abb_sk_live_* key used ONLY for the CI smoke test
#                     (scope it to a throwaway sub-account; rotate freely)
#
# Required for deploy gating:
#   This workflow *must* pass before any deploy runs. Protect main branch
#   with the "Production readiness / smoke" status check.

name: Production readiness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-env:
    name: Config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-dotenv
      - name: Advisory configuration check
        run: python scripts/verify_production_env.py

      - name: Live site health (optional)
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "${SITE_URL:-}" ] || [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "Skipping live ping: add SITE_URL and ADMIN_TOKEN as repository secrets to enable."
            exit 0
          fi
          python scripts/verify_production_env.py --ping

  pytest:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/ --ignore=tests/test_settings_persistence.js -q

  smoke:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    needs: [verify-env, pytest]
    # Gate on SITE_URL so forks and PRs from branches without secrets still
    # run the cheap checks without failing on the expensive one.
    if: ${{ github.event_name != 'pull_request' || github.repository == 'abbieymatthewslol/abbiey-search-engine-2' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check SITE_URL is configured
        id: gate
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "${SITE_URL:-}" ]; then
            echo "SITE_URL secret not set; skipping smoke tests. Configure the secret to enable."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright
        if: steps.gate.outputs.skip != 'true'
        run: |
          npm init -y
          npm install @playwright/test
          npx playwright install --with-deps chromium

      - name: Run smoke script
        if: steps.gate.outputs.skip != 'true'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_TEST_KEY: ${{ secrets.API_TEST_KEY }}
        run: node tests/smoke/production-smoke.mjs

      - name: Upload smoke screenshots
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: tests/smoke/screenshots/
          if-no-files-found: ignore
