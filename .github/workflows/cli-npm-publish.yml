name: Publish CLI to npm

# Publishes cli/ when a tag cli-vMAJOR.MINOR.PATCH matches cli/package.json "version".
# Requires repository secret NPM_TOKEN (npm granular or automation token with publish permission).

on:
  push:
    tags:
      - "cli-v*"

concurrency:
  group: cli-npm-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Match package version to tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:?}"
          if [[ ! "${TAG}" =~ ^cli-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match cli-vMAJOR.MINOR.PATCH (got: ${TAG})"
            exit 1
          fi
          WANT="${TAG#cli-v}"
          GOT="$(jq -r '.version' cli/package.json)"
          if [[ "${WANT}" != "${GOT}" ]]; then
            echo "cli/package.json version (${GOT}) must equal tag semver (${WANT}); tag is ${TAG}"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cli/package-lock.json
          registry-url: "https://registry.npmjs.org"

      - name: Install and build CLI
        working-directory: cli
        run: |
          npm ci
          npm run build

      - name: Publish to npm
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
