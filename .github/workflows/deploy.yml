name: Deploy to Vercel

# Deploys the single production project for https://abbieysearch.com (see .github/PLATFORM_INTEGRATIONS.md).
on:
  push:
    branches:
      - master
  # GitHub → Actions → "Deploy to Vercel" → Run workflow (no code change needed)
  workflow_dispatch:

concurrency:
  group: vercel-prod-${{ github.repository }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ynmEwQEoP5I6GjvWlRkxa34I
  VERCEL_PROJECT_ID: prj_hGdLqDsNtQK2A57hWyZNxdZKMi3b

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
