name: Deploy to Vercel

# Production from Git: Vercel builds when the connected branch (e.g. main) updates — see sync-main-from-master.yml.
# This workflow: on push to master, run tests only. The deploy job runs on workflow_dispatch (manual) or add trigger if you want CLI on every push.
# See .github/PLATFORM_INTEGRATIONS.md
on:
  push:
    branches:
      - master
  # GitHub → Actions → "Deploy to Vercel" → Run workflow (manual CLI deploy / rollback)
  workflow_dispatch:

concurrency:
  group: vercel-prod-${{ github.repository }}
  cancel-in-progress: true

env:
  # Must match .vercel/project.json (abbieys-projects / search-engine)
  VERCEL_ORG_ID: team_YeguIG4NHm4Kp0Jf5AbOwgFN
  VERCEL_PROJECT_ID: prj_hGdLqDsNtQK2A57hWyZNxdZKMi3b

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: pytest tests/ -v --tb=short

  deploy:
    # Avoid double-deploy: Vercel builds production from Git. Use this job only when dispatching manually.
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install uv (Python package manager)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Attack Challenge Mode shows a browser checkpoint (HTTP 429) instead of the app.
      - name: Ensure Attack Challenge Mode is off
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
        run: python3 scripts/disable_vercel_attack_challenge.py
