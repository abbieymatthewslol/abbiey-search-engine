name: Deploy to Vercel

# Automatic: every push to main runs tests, then `vercel build` + `vercel deploy --prebuilt --prod`.
# Requires secret VERCEL_TOKEN. Optional post-deploy verification uses SITE_URL,
# ADMIN_TOKEN, and API_TEST_KEY when present as repository or environment secrets.
# Manual re-run: Actions → this workflow → Run workflow.
# Vercel Git builds on `main` are skipped (vercel.json ignoreCommand) so GitHub Actions remains the single production path.
# See .github/PLATFORM_INTEGRATIONS.md
on:
  push:
    branches:
      - main
  # GitHub → Actions → "Deploy to Vercel" → Run workflow (manual CLI deploy / rollback)
  workflow_dispatch:

concurrency:
  group: vercel-prod-${{ github.repository }}
  cancel-in-progress: true

env:
  # Must match .vercel/project.json (abbieys-projects / search-engine)
  VERCEL_ORG_ID: team_YeguIG4NHm4Kp0Jf5AbOwgFN
  VERCEL_PROJECT_ID: prj_hGdLqDsNtQK2A57hWyZNxdZKMi3b

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests (changed files only)
        env:
          DIFF_BASE: ${{ github.event.before }}
          DIFF_HEAD: ${{ github.sha }}
        run: python scripts/run_tests_for_changes.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install uv (Python package manager)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Attack Challenge Mode shows a browser checkpoint (HTTP 429) instead of the app.
      - name: Ensure Attack Challenge Mode is off
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
        run: python3 scripts/disable_vercel_attack_challenge.py

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-dotenv
      - name: Live health check (optional)
        run: |
          if [ -z "${{ secrets.SITE_URL }}" ] || [ -z "${{ secrets.ADMIN_TOKEN }}" ]; then
            echo "Skipping post-deploy health: add SITE_URL and ADMIN_TOKEN repo/environment secrets to enforce live verification."
            exit 0
          fi
          SITE_URL="${{ secrets.SITE_URL }}" ADMIN_TOKEN="${{ secrets.ADMIN_TOKEN }}" API_TEST_KEY="${{ secrets.API_TEST_KEY }}" python scripts/verify_production_env.py --ping

  smoke-live:
    needs: verify-live
    uses: ./.github/workflows/_production-readiness-smoke.yml
    secrets: inherit
